plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'RyanHCode'
                url = 'https://maven.ryanhcode.dev/releases'
            }
        }
        filter {
            includeGroup 'dev.ryanhcode.sable-companion'
        }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// 'localRuntime' = present in runClient/runServer, but never published as a dependency of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Sable Companion (MIT): Sable's public compat API. Bundled (jar-in-jar) as its author recommends;
    // its default implementation is a no-op, and Sable overrides it when installed.
    jarJar(implementation("dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:[${sable_companion_version},)")) {
        version {
            prefer(project.sable_companion_version)
        }
    }

    // Mods we compile against (we write mixins/code targeting their classes)
    compileOnly "maven.modrinth:comforts:${comforts_version}"
    compileOnly "maven.modrinth:sable:${sable_version}"
    compileOnly "maven.modrinth:create-aeronautics:${aeronautics_version}"

    // Same mods at runtime for the dev client, plus Create (required by Create Aeronautics)
    localRuntime "maven.modrinth:comforts:${comforts_version}"
    localRuntime "maven.modrinth:sable:${sable_version}"
    localRuntime "maven.modrinth:create-aeronautics:${aeronautics_version}"
    localRuntime "maven.modrinth:create:${create_version}"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_authors            : mod_authors,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// Ship the license inside the jar
tasks.named('jar', Jar) {
    var licenseName = "LICENSE_${mod_id}"
    from('LICENSE') {
        rename { licenseName }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
