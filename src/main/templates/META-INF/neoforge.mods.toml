modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Lambert-Aaron/comforts-sable-compat/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
displayURL="https://github.com/Lambert-Aaron/comforts-sable-compat"
credits='''Comforts by TheIllusiveC4 (Illusive Soulworks). Sable and Sable Companion by ryanhcode and contributors. Create Aeronautics by the Simulated Team. Thanks to rsap, author of Create Aeronautics: Compatibility, whose project inspired this fix.'''
description='''
Lets players sleep in Comforts sleeping bags and hammocks placed on Sable physics structures (Create Aeronautics ships).
Only needed on the server (and in singleplayer); clients without it can still join.
'''
# The fix only runs in server-side sleep logic: clients without this mod may connect to a server that has it.
displayTest="IGNORE_SERVER_VERSION"

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="comforts"
    type="required"
    versionRange="[9.0.5,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="sable"
    type="optional"
    versionRange="[2.0.5,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
